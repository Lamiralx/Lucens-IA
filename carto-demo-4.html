<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucens carto — couleurs signature</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #0a0d12;
    color: #e6e8ed;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 14px;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 8px;
  }
  .sub {
    color: #8a92a3;
    font-size: 12px;
    margin-bottom: 32px;
  }
  .demo {
    margin-bottom: 28px;
    border: 1px solid #1c2230;
    border-radius: 8px;
    overflow: hidden;
    background: #0e1218;
  }
  .demo-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 18px;
    border-bottom: 1px solid #1c2230;
  }
  .demo-title {
    font-size: 12px;
    font-weight: 600;
    color: #ffffff;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .swatch {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'SF Mono', Consolas, monospace;
    font-size: 10px;
    color: #56607a;
  }
  .swatch-color {
    width: 14px;
    height: 14px;
    border-radius: 3px;
    border: 1px solid rgba(255,255,255,0.15);
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
  }
</style>
</head>
<body>

<h1>Lucens IA — couleur signature</h1>
<div class="sub">Style sélection pure (outline + glow), aucun label, aucune mesure. 5 variantes de couleur à choisir.</div>

<div class="demo">
  <div class="demo-header">
    <span class="demo-title">Référence</span>
    <span class="swatch">BASE</span>
  </div>
  <canvas id="cBase" width="500" height="380"></canvas>
</div>

<div class="demo">
  <div class="demo-header">
    <span class="demo-title">Cyan électrique</span>
    <span class="swatch"><span class="swatch-color" style="background:#00E5FF"></span>#00E5FF</span>
  </div>
  <canvas id="c1" width="500" height="380"></canvas>
</div>

<div class="demo">
  <div class="demo-header">
    <span class="demo-title">Amber instrument</span>
    <span class="swatch"><span class="swatch-color" style="background:#FFB300"></span>#FFB300</span>
  </div>
  <canvas id="c2" width="500" height="380"></canvas>
</div>

<div class="demo">
  <div class="demo-header">
    <span class="demo-title">Magenta signature</span>
    <span class="swatch"><span class="swatch-color" style="background:#FF1493"></span>#FF1493</span>
  </div>
  <canvas id="c3" width="500" height="380"></canvas>
</div>

<div class="demo">
  <div class="demo-header">
    <span class="demo-title">Vert phosphorescent</span>
    <span class="swatch"><span class="swatch-color" style="background:#39FF14"></span>#39FF14</span>
  </div>
  <canvas id="c4" width="500" height="380"></canvas>
</div>

<div class="demo">
  <div class="demo-header">
    <span class="demo-title">Rouge orangé clinique</span>
    <span class="swatch"><span class="swatch-color" style="background:#FF5722"></span>#FF5722</span>
  </div>
  <canvas id="c5" width="500" height="380"></canvas>
</div>

<script>
'use strict';

const W = 500, H = 380;

function buildBase(ctx) {
  const grad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, Math.max(W, H));
  grad.addColorStop(0, '#1a2245');
  grad.addColorStop(0.5, '#0c1228');
  grad.addColorStop(1, '#03050d');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  const img = ctx.getImageData(0, 0, W, H);
  const d = img.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 12;
    d[i]   = Math.max(0, Math.min(255, d[i]   + n));
    d[i+1] = Math.max(0, Math.min(255, d[i+1] + n));
    d[i+2] = Math.max(0, Math.min(255, d[i+2] + n));
  }
  ctx.putImageData(img, 0, 0);

  for (let i = 0; i < 90; i++) {
    const x = Math.random() * W;
    const y = Math.random() * H;
    const r = Math.random() * 1.2 + 0.5;
    ctx.fillStyle = `rgba(150, 200, 255, ${0.4 + Math.random() * 0.3})`;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  const cx = W * 0.52, cy = H * 0.55;
  const halo = ctx.createRadialGradient(cx, cy, 30, cx, cy, 160);
  halo.addColorStop(0, 'rgba(80, 200, 220, 0.55)');
  halo.addColorStop(0.4, 'rgba(60, 160, 200, 0.35)');
  halo.addColorStop(1, 'rgba(20, 80, 140, 0)');
  ctx.fillStyle = halo;
  ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < 4500; i++) {
    const a = Math.random() * Math.PI * 2;
    const dist = Math.pow(Math.random(), 0.6) * 100;
    const px = cx + Math.cos(a) * dist + (Math.random() - 0.5) * 15;
    const py = cy + Math.sin(a) * dist * 0.7 + (Math.random() - 0.5) * 12;
    const intensity = 1 - dist / 110;
    const r = Math.random() * 1.3 + 0.3;

    const cyanWeight = intensity * 0.9;
    const baseR = 60 + 180 * (1 - cyanWeight) + Math.random() * 30;
    const baseG = 180 + 50 * cyanWeight + Math.random() * 25;
    const baseB = 200 + 30 * cyanWeight + Math.random() * 25;

    ctx.fillStyle = `rgba(${Math.min(255, baseR)|0}, ${Math.min(255, baseG)|0}, ${Math.min(255, baseB)|0}, ${0.4 + intensity * 0.5})`;
    ctx.beginPath();
    ctx.arc(px, py, r, 0, Math.PI * 2);
    ctx.fill();
  }

  const orangeX = cx + 75, orangeY = cy - 35;
  const orangeGrad = ctx.createRadialGradient(orangeX, orangeY, 0, orangeX, orangeY, 22);
  orangeGrad.addColorStop(0, 'rgba(255, 130, 50, 0.95)');
  orangeGrad.addColorStop(0.5, 'rgba(255, 90, 30, 0.7)');
  orangeGrad.addColorStop(1, 'rgba(220, 60, 20, 0)');
  ctx.fillStyle = orangeGrad;
  ctx.beginPath();
  ctx.arc(orangeX, orangeY, 22, 0, Math.PI * 2);
  ctx.fill();
}

function detectFluo(ctx) {
  const img = ctx.getImageData(0, 0, W, H);
  const d = img.data;
  const mask = new Uint8Array(W * H);

  for (let i = 0, p = 0; i < d.length; i += 4, p++) {
    const r = d[i], g = d[i+1], b = d[i+2];
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    const lum = (r + g + b) / 3;
    const sat = max === 0 ? 0 : (max - min) / max;
    if (sat > 0.25 && lum > 90) mask[p] = 1;
  }
  return mask;
}

// Style sélection pure : outline + glow, paramétré par couleur signature
function drawSelection(ctx, mask, rgbHex) {
  // Convert hex to rgb
  const r = parseInt(rgbHex.slice(1,3), 16);
  const g = parseInt(rgbHex.slice(3,5), 16);
  const b = parseInt(rgbHex.slice(5,7), 16);
  const rgbStr = `rgb(${r}, ${g}, ${b})`;

  // Glow layer offscreen
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const octx = off.getContext('2d');

  octx.strokeStyle = `rgba(${r}, ${g}, ${b}, 0.65)`;
  octx.lineWidth = 1.0;
  octx.beginPath();
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      const p = y * W + x;
      if (!mask[p]) continue;
      if (!mask[p - 1])  { octx.moveTo(x, y);     octx.lineTo(x, y + 1); }
      if (!mask[p + 1])  { octx.moveTo(x + 1, y); octx.lineTo(x + 1, y + 1); }
      if (!mask[p - W])  { octx.moveTo(x, y);     octx.lineTo(x + 1, y); }
      if (!mask[p + W])  { octx.moveTo(x, y + 1); octx.lineTo(x + 1, y + 1); }
    }
  }
  octx.stroke();

  // Glow composé en mode screen
  ctx.save();
  ctx.globalCompositeOperation = 'screen';
  ctx.filter = 'blur(6px)';
  ctx.drawImage(off, 0, 0);
  ctx.filter = 'blur(2.5px)';
  ctx.drawImage(off, 0, 0);
  ctx.restore();

  // Outline pixel-perfect par-dessus
  ctx.save();
  ctx.strokeStyle = `rgba(${r}, ${g}, ${b}, 0.95)`;
  ctx.lineWidth = 1.0;
  ctx.lineCap = 'round';
  ctx.beginPath();
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      const p = y * W + x;
      if (!mask[p]) continue;
      if (!mask[p - 1])  { ctx.moveTo(x, y);     ctx.lineTo(x, y + 1); }
      if (!mask[p + 1])  { ctx.moveTo(x + 1, y); ctx.lineTo(x + 1, y + 1); }
      if (!mask[p - W])  { ctx.moveTo(x, y);     ctx.lineTo(x + 1, y); }
      if (!mask[p + W])  { ctx.moveTo(x, y + 1); ctx.lineTo(x + 1, y + 1); }
    }
  }
  ctx.stroke();
  ctx.restore();
}

// Rendu
['cBase', 'c1', 'c2', 'c3', 'c4', 'c5'].forEach(id => {
  const c = document.getElementById(id);
  const ctx = c.getContext('2d');
  buildBase(ctx);
});

const ref = document.getElementById('cBase');
const mask = detectFluo(ref.getContext('2d'));

drawSelection(document.getElementById('c1').getContext('2d'), mask, '#00E5FF');
drawSelection(document.getElementById('c2').getContext('2d'), mask, '#FFB300');
drawSelection(document.getElementById('c3').getContext('2d'), mask, '#FF1493');
drawSelection(document.getElementById('c4').getContext('2d'), mask, '#39FF14');
drawSelection(document.getElementById('c5').getContext('2d'), mask, '#FF5722');

</script>
</body>
</html>
